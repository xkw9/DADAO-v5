schema_version: 1.0.0
authority:
  order:
  - README.md
  - spec/SimRISC-00-指令系统设计.md
  - spec/SimRISC-03-浮点类指令.md
  - .xkw/knowledge/adr-1004-f1-floating-phase.md
  - .xkw/knowledge/contract-f1-floating.md
  - contracts/opcodes.yaml
  order_rule: 根 README.md 的 SimRISC 版本声明 → spec/SimRISC-00 与 spec/SimRISC-03 → ADR-1004 的 Accepted 边界 → 已验证 contract 与 contracts/opcodes.yaml
    投影
  semantics_owner:
  - spec/SimRISC-00-指令系统设计.md
  - spec/SimRISC-03-浮点类指令.md
  accepted_adr_boundary: .xkw/knowledge/adr-1004-f1-floating-phase.md
  verified_upstream:
  - .xkw/knowledge/contract-f1-floating.md
  - contracts/opcodes.yaml
  accepted_adr_content_scope: ADR-1004 D11–D17 的 Accepted 内容仅为 OPEN/BLOCKED 暂缓，不含任何语义取值
  note: spec 原文决定语义；contract 与机器数据只用于完整性与已验证映射，不得反向覆盖 spec。实现参考、第三方数值库默认行为、宿主库、历史参考仓与工作日志只能说明实现代价或历史，不得证明规范答案。
  cited_files_must_be_in_order: true
identity_universe:
  total: 64
  split: 64 = 18 rf-qfc + 46 misc-rf
  groups:
    rf-qfc: 18
    misc-rf: 46
  pseudo_excluded:
  - set.ft
  - set.fo
  pseudo_exclusion_rule: set.ft/set.fo 是伪指令，不计入 64；assembler 展开与 disassembler 打印不改变 64 计数
  facet_keys:
  - encoding
  - format
  - operands
  - legality
  - semantics
  - rf0_operand
  - tetra_high_half
  - fcsr_flags
  - tininess
  - compare_unordered
  - nan_propagation
  facet_status_enum:
  - spec-determined
  - partial
  - open-blocked
  - n/a
  facet_status_meaning:
    spec-determined: 规范给出唯一答案，可直接实现
    partial: 规范给出部分答案，剩余部分未规定，须附 note
    open-blocked: 规范未给唯一答案，登记到 ADR-1004 的对应 D*
    n/a: 该 facet 对本 identity 不适用
  pinned_d_projection:
    D11: 37
    D12: 53
    D13: 18
    D14: 4
    D15: 18
    D16: 36
    D17: 64
  pinned_projection_note: 37/53/18/4/18/36/64 是校验基线，不是本任务可改的语义结论；由 contracts/opcodes.yaml 的 f1.open_items 逐条重算，并与 contract
    §6.1 表交叉核对
  derivation: tools/spec/check_f1_gap_proofs.py 独立重算：contracts/opcodes.yaml 记录总数、含 f1 块计数、分组计数、逐 identity open_items 投影
decision_proofs:
  D11:
    title: rf0 一般 ILLI 规则与 sign-injection 特例的适用章节、优先级与搬移边界
    question: rf0→ILLI 一般规则覆盖哪些章节？与 ftsgnj/fosgnj/ftsgnn/fosgnn 的 abs/-abs 特例冲突时哪条优先？rd2rf/rf2rd 以 rf0 为目的或来源时是否受该规则约束？
    classification: genuine-gap
    status: OPEN
    blocked_facet: rf0_operand
    affected_identity_count: 37
    affected_identities_scope: facet rf0_operand == open-blocked（37 条，由 contracts/opcodes.yaml 的 f1.facets 逐 identity 重算）
    cross_cutting: false
    affected_facets:
    - rf0_operand
    - legality
    - semantics
    search_scope:
    - spec/SimRISC-00-指令系统设计.md
    - spec/SimRISC-03-浮点类指令.md
    spec_cites:
    - ref: spec/SimRISC-03-浮点类指令.md:8
      file: spec/SimRISC-03-浮点类指令.md
      lines: '8'
      quote: 浮点运算指令的目的或任一源操作数为 rf0 时触发
    - ref: spec/SimRISC-03-浮点类指令.md:8
      file: spec/SimRISC-03-浮点类指令.md
      lines: '8'
      quote: rf ld/st 中 rf0 为目的时允许
    - ref: spec/SimRISC-03-浮点类指令.md:216
      file: spec/SimRISC-03-浮点类指令.md
      lines: '216'
      quote: 当rfhd为rf0时，ftsgnj和fosgnj实现了
    - ref: spec/SimRISC-03-浮点类指令.md:217
      file: spec/SimRISC-03-浮点类指令.md
      lines: '217'
      quote: 当rfhd为rf0时，ftsgnn和fosgnn实现了
    - ref: spec/SimRISC-03-浮点类指令.md:44
      file: spec/SimRISC-03-浮点类指令.md
      lines: '44'
      quote: 指令语义为，将hc开始的immu6个寄存器复制到hb开始的immu6个寄存器中
    - ref: spec/SimRISC-03-浮点类指令.md:60
      file: spec/SimRISC-03-浮点类指令.md
      lines: '60'
      quote: '`set.w` 指令只设置相应的16位，其余48位不变'
    - ref: spec/SimRISC-03-浮点类指令.md:127
      file: spec/SimRISC-03-浮点类指令.md
      lines: '127'
      quote: 源和目的寄存器范围可以重叠，转换按序号递增逐对进行，先读后写
    - ref: spec/SimRISC-03-浮点类指令.md:195
      file: spec/SimRISC-03-浮点类指令.md
      lines: '195'
      quote: S1D1 指令硬件先读源操作数再写结果
    - ref: ADR-1004 D11
      file: .xkw/knowledge/adr-1004-f1-floating-phase.md
      lines: '55'
      quote: 一般 rf0→ILLI 规则与 sign-injection 特例的优先级为 OPEN/BLOCKED
    evidence:
    - id: D11-E1
      kind: spec-text
      source: spec/SimRISC-03-浮点类指令.md:8
      finding: 一般规则写成「浮点运算指令的目的或任一源操作数为 rf0 时触发 ILLI 异常」，并只对「浮点运算指令」这一集合下断言；SimRISC-03 的章节结构中该集合只明确对应 §浮点运算指令（S2D1/S3D1/S1D1），§格式转换指令、§浮点分类指令、§浮点比较指令、§浮点条件赋值指令、§寄存器组之间块赋值是否被覆盖，原文没有说明。
    - id: D11-E2
      kind: spec-conflict
      source: spec/SimRISC-03-浮点类指令.md:8,216,217
      finding: 同一节内两条规则对同一编码给出相反要求：一般规则要求 rf0 参与运算触发 ILLI，:215/:216 的特例却要求 rfhd=rf0 时产生 abs/-abs 结果。原文没有给出任何优先级措辞（如「特例优先」「例外」）。
    - id: D11-E3
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md
      finding: 在 SimRISC-03 全文（含 §存取RF寄存器、§寄存器组之间块赋值、§立即数常数赋值、§格式转换指令、§浮点运算指令、§浮点符号位操作指令、§浮点比较指令、§浮点条件赋值指令、§浮点分类指令、§set.ft/set.fo
        伪指令）检索术语「rf0」「ILLI」「只读」：命中仅为 :7（一般规则与 rf ld/st 目的允许）、:215–:218（符号位特例）、:30/:31/:48/:49/:132/:133（immu6/范围 ILLI 谓词）；除
        :7 外没有任何一条规则提到 rd2rf/rf2rd 的 rf0 边界。
    - id: D11-E4
      kind: spec-text
      source: spec/SimRISC-03-浮点类指令.md:127,195
      finding: 格式转换节与 S1D1 节各自明示「先读后写/先读全部源再写」，这两处的操作数重叠行为因此是 spec-determined，不属于 D11；D11 的开口只可能落在块赋值节的 rd2rf/rf2rd 与两条规则的适用范围上。
    - id: D11-E5
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md:44,60
      finding: 块赋值节只写「将 hc 开始的 immu6 个寄存器复制到 hb 开始的 immu6 个寄存器中」，未提 rf0；§立即数常数赋值只写「set.w 只设置相应的16位，其余48位不变」，未提 rf0 特例。两条规则都未点名这两类指令。
    missing_or_conflicting: 缺失：一般规则的章节适用范围、冲突优先级、rd2rf/rf2rd 的 rf0 边界。冲突：SimRISC-03:7 与 SimRISC-03:215/216 对 rfhd=rf0 的同一编码提出互斥要求。
    classification_reason: 规范对「rf0 参与运算是否必然 ILLI」在不同章节给出互斥表述且无优先级，故不存在唯一答案；属真实缺口，登记 D11/OPEN-BLOCKED。本分类不携带任何取值。
    observable_consequences:
    - 同一编码（ftsgnj/fosgnj/ftsgnn/fosgnn 且 rfhd=rf0）在两种读法下要么产生结果要么触发 ILLI，QEMU 实现与 oracle 无法同时满足
    - rd2rf/rf2rd 以 rf0 为目的或来源时，合法向量与 legality-negative 向量的分界不同
    - §格式转换指令等 5 个章节的 46 条 misc-rf identity 中，哪些属于「浮点运算指令」直接决定 illegal-encoding 测试的存在性
    candidate_question_ids:
    - CAND-D11-SCOPE
    - CAND-D11-PRIORITY
    - CAND-D11-MOVE
    blocked_assertions:
    - legality-negative
    - runtime semantics
    - milestone facet
    - facet-closure
    unblock_condition:
    - 规范勘误给出唯一答案（spec 原文修订并重新核对本文件与机器投影）
    - 相应 Candidate decision 经用户逐条确认并由主会话写入 Accepted ADR
  D12:
    title: FCSR flags 的更新/保持/清除与数据搬移是否更新 flags
    question: rf0[4:0] 是 sticky OR 还是每次整体写入？无异常指令执行后是否保持？是否存在软件清除路径？rf ld/st/ldm/stm/set.w/rd2rf/rf2rd 是否更新 flags？
    classification: genuine-gap
    status: BLOCKED
    blocked_facet: fcsr_flags
    affected_identity_count: 53
    affected_identities_scope: facet fcsr_flags == open-blocked（53 条，由 contracts/opcodes.yaml 的 f1.facets 逐 identity 重算）
    cross_cutting: false
    affected_facets:
    - fcsr_flags
    - legality
    - semantics
    search_scope:
    - spec/SimRISC-00-指令系统设计.md
    - spec/SimRISC-03-浮点类指令.md
    spec_cites:
    - ref: spec/SimRISC-00-指令系统设计.md:86
      file: spec/SimRISC-00-指令系统设计.md
      lines: '86'
      quote: '- [4..0]：异常状态（Accured exception）'
    - ref: spec/SimRISC-00-指令系统设计.md:107
      file: spec/SimRISC-00-指令系统设计.md
      lines: '107'
      quote: 异常状态位（NV/DZ/OF/UF/NX）由硬件按 IEEE 754 标准设置到 rf0[4:0]
    - ref: spec/SimRISC-00-指令系统设计.md:88
      file: spec/SimRISC-00-指令系统设计.md
      lines: '88'
      quote: 舍入模式的设置单独放在wp1中，程序可以直接用setw指令进行设置
    - ref: spec/SimRISC-03-浮点类指令.md:8
      file: spec/SimRISC-03-浮点类指令.md
      lines: '8'
      quote: 写只读位时静默忽略，rw 位正常写入
    - ref: spec/SimRISC-03-浮点类指令.md:129
      file: spec/SimRISC-03-浮点类指令.md
      lines: '129'
      quote: 舍入模式由 rf0[17:16] 控制，异常标志在 rf0[4:0]
    - ref: ADR-1004 D12
      file: .xkw/knowledge/adr-1004-f1-floating-phase.md
      lines: '59'
      quote: 异常 flags 的 sticky/覆盖、清除及无异常保留规则为 OPEN/BLOCKED
    evidence:
    - id: D12-E1
      kind: spec-text
      source: spec/SimRISC-00-指令系统设计.md:86,107
      finding: SimRISC-00 只声明 [4..0] 是「异常状态」并说「由硬件按 IEEE 754 标准设置到 rf0[4:0]」；「设置」既可读作置位（sticky OR）也可读作按本次结果整体写入，原文没有区分。
    - id: D12-E2
      kind: spec-absence-scan
      source: spec/SimRISC-00-指令系统设计.md; spec/SimRISC-03-浮点类指令.md
      finding: 在两文件全文检索「清除」「清零」「sticky」「累积」「累加」「复位 flags」：无任何命中说明软件如何清除 flags，也无命中说明不产生异常的指令是否保留旧 flags。作为对照，同一文件对舍入模式给出了明确的软件设置路径（:88），对
        flags 没有给任何路径。
    - id: D12-E3
      kind: spec-conflict
      source: spec/SimRISC-03-浮点类指令.md:8
      finding: SimRISC-03:7 说 rf0 的 rw 位「正常写入」，而 rf0[4..0] 落在 rw 域内，因此 ld/st/ldm/stm/set.w 写 rf0 可以直接改 flags；这与 SimRISC-00:107
        的「由硬件设置」叠加时的先后顺序规范未规定。
    - id: D12-E4
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md
      finding: §存取RF寄存器、§寄存器组之间块赋值、§立即数常数赋值三节只规定数据面（对齐、immu6、wyde-position、16/48 位划分），没有任何一条说明这些搬移指令是否写 rf0[4:0]。
    missing_or_conflicting: 缺失：sticky/覆盖之争、无异常保持规则、软件清除路径、搬移指令与 flags 的叠加顺序。冲突：SimRISC-03:7 的「rw 位正常写入」与 SimRISC-00:107 的「由硬件设置」对同一
      5 位域给出两个写入者而无排序。
    classification_reason: 规范对同一 5 位域给出两个未排序的写入者，且完全缺失保持/清除语义；无唯一答案，属真实缺口，登记 D12/OPEN-BLOCKED。
    observable_consequences:
    - 无异常指令后 flags 期望值在两种读法下不同（保持旧值 vs 清零）
    - 是否存在清 flags 的软件路径决定 oracle 是否需要专门的清零序列与复位向量
    - 11 条 fcsr_flags == spec-determined 的 identity（搬移/存取类）是否写 flags 不定，直接改变其 expected_rf
    candidate_question_ids:
    - CAND-D12-UPDATE
    - CAND-D12-KEEP
    - CAND-D12-CLEAR
    - CAND-D12-SCOPE
    - CAND-D12-MOVE
    blocked_assertions:
    - reset-dependent expected
    - runtime semantics
    - milestone facet
    - facet-closure
    unblock_condition:
    - 规范勘误给出唯一答案（spec 原文修订并重新核对本文件与机器投影）
    - 相应 Candidate decision 经用户逐条确认并由主会话写入 Accepted ADR
  D13:
    title: 单精（ft）结果或 4 字节载入写 RF 后的高 32 位
    question: 单精结果写入 rf 槽位后高 32 位是保留原值、清零还是写入默认 NaN 位型？该规则是否也适用于 ld.t-rf/ldm.t-rf 的 4 字节载入？
    classification: genuine-gap
    status: OPEN
    blocked_facet: tetra_high_half
    affected_identity_count: 18
    affected_identities_scope: facet tetra_high_half == open-blocked（18 条，由 contracts/opcodes.yaml 的 f1.facets 逐 identity
      重算）
    cross_cutting: false
    affected_facets:
    - tetra_high_half
    - semantics
    search_scope:
    - spec/SimRISC-00-指令系统设计.md
    - spec/SimRISC-03-浮点类指令.md
    spec_cites:
    - ref: spec/SimRISC-00-指令系统设计.md:73
      file: spec/SimRISC-00-指令系统设计.md
      lines: '73'
      quote: 当存放单精32位数据时，只使用低32位，高32位不做特殊规定
    - ref: spec/SimRISC-00-指令系统设计.md:80
      file: spec/SimRISC-00-指令系统设计.md
      lines: '80'
      quote: 其值为fo格式下的Quiet NaN，即符号位为0，E为全1，尾数最高位为1
    - ref: spec/SimRISC-00-指令系统设计.md:82
      file: spec/SimRISC-00-指令系统设计.md
      lines: '82'
      quote: 其值为ft格式下的Quiet NaN，即符号位为0，E为全1，尾数最高位为1
    - ref: spec/SimRISC-03-浮点类指令.md:8
      file: spec/SimRISC-03-浮点类指令.md
      lines: '8'
      quote: rf ld/st 中 rf0 为目的时允许
    - ref: spec/SimRISC-03-浮点类指令.md:127
      file: spec/SimRISC-03-浮点类指令.md
      lines: '127'
      quote: immu6 指定连续转换的寄存器数量（1-63）
    - ref: ADR-1004 D13
      file: .xkw/knowledge/adr-1004-f1-floating-phase.md
      lines: '63'
      quote: 单精结果写入后 RF 槽位高 32 位行为为 OPEN/BLOCKED
    evidence:
    - id: D13-E1
      kind: spec-text
      source: spec/SimRISC-00-指令系统设计.md:73
      finding: 规范对单精数据在 rf 中的高位只写「高32位不做特殊规定」——这是显式的「不规定」，不是「唯一确定为 0」；因此不能从低位使用推出高位值。
    - id: D13-E2
      kind: spec-conflict
      source: spec/SimRISC-00-指令系统设计.md:80,82
      finding: rf0 的 [63..51] 与 [31..22] 是只读的 fo/ft 两种 Quiet NaN 位型，说明「高 32 位」是架构上有意义的可观测区域（含只读 NaN 位型），与「不做特殊规定」并存时无法判定写入单精结果后该区域应保持什么。
    - id: D13-E3
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md; spec/SimRISC-00-指令系统设计.md
      finding: 在两文件全文检索「高 32」「高32」「高位」「清零」「zero-extend」：仅 SimRISC-00:73 一处命中且为「不做特殊规定」；没有任何一条规定 ft 结果或 4 字节载入后的高半部处理。
    - id: D13-E4
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md:8,20-23
      finding: §存取RF寄存器只规定 rf0 作目的允许与读写位掩码，未规定 32 位载入（ld.t-rf/ldm.t-rf）时 rf 槽位 [63..32] 是保留原值还是清零；这与 §格式转换指令的 ft2* 是两类不同写入口，需分别确认。
    missing_or_conflicting: 缺失：单精结果与 4 字节载入写 rf 后 [63..32] 的值。冲突：SimRISC-00:73「不做特殊规定」与 SimRISC-00:80/82「该区域是只读 NaN 位型」并置时无判定规则。
    classification_reason: 规范对被写入区域显式声明不规定，且该区域同时承载只读 NaN 位型，不存在唯一答案；属真实缺口，登记 D13/OPEN-BLOCKED。
    observable_consequences:
    - 同一 expected_rf 在「保留原值」与「清零」两种读法下不同，且原值依赖前序指令
    - fo2ft/ft2fo 转换向量与 ft 算术向量的高 32 位期望不可同时确定
    - 只读位型 [63..51]/[31..22] 与「静默忽略」规则的交互在高半部被写入时会产生第三种可观测结果
    candidate_question_ids:
    - CAND-D13-WRITE
    - CAND-D13-LOAD
    blocked_assertions:
    - runtime semantics
    - milestone facet
    - facet-closure
    unblock_condition:
    - 规范勘误给出唯一答案（spec 原文修订并重新核对本文件与机器投影）
    - 相应 Candidate decision 经用户逐条确认并由主会话写入 Accepted ADR
  D14:
