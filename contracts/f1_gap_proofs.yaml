    - 上界：immu6 编码在 hd[5:0]（6 位），最大可取值 63；「1~63」的上界与位宽一致，三节没有分歧。
    - 下界：immu6 = 0 在 §存取RF寄存器(:29)、§寄存器组之间块赋值(:48)、§格式转换指令(:132) 三处各有独立 ILLI 谓词，故三节都排除 0。
