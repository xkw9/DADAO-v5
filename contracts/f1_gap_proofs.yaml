      finding: 「rfhd 取整数值」有两种读法（S5）；块赋值的跨寄存器组方向已由原始规范唯一确定（历史 S7 记为 spec-determined，不进入 active ledger）；ldm/stm 只给签名与对齐、只说「多个连续的寄存器」未说地址连续（S8）。
    - id: D17-E6
      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md:8
      finding: SimRISC-03:7 只覆盖 [63..51] 与 [31..22] 两个只读域的「写静默忽略」，而 :81/:83/:85 的 [50..32]、[21..18]、[15..5] 标为 SBZ 且未写写入行为——S6。
    - id: D17-E7
      kind: spec-text
      source: spec/SimRISC-00-指令系统设计.md:41-46; spec/SimRISC-03-浮点类指令.md:34-50
      finding: SimRISC-00:41-46 把数据寄存器 rd0-rd63 与浮点寄存器 rf0-rf63 列为两个不同寄存器组；SimRISC-03:33-49 固定列出 rf2rd 的 RF→RD 与 rd2rf 的 RD→RF 操作数方向。跨不同寄存器组的块复制不存在同组重叠处理，故历史
        S7 是 spec-determined 的非缺口，只记入 non_gap_records，不进入 active ledger。
    missing_or_conflicting: 缺失：S1 复位值、S3 classify immediate 合法性、S4 fault 优先级、S5 scaleB 指数读法、S6 SBZ 写入行为、S8 ldm/stm
      内存侧语义——这六项才是 active 缺口。冲突：S2 的表述不一致已被证明无行为后果，不进入 ledger；历史 S7 已由原始规范唯一确定为 spec-determined
      （非缺口），不计入 active 缺失项。
    classification_reason: D17 是兜底登记：六项 active 静默项各自缺一个唯一答案，必须逐项登记为具名 OPEN-ID；D17 本身不产生任何语义值，也不得用一次总选择关闭六项。历史
      S7 已由原始规范证明为 spec-determined（非缺口），不进入 ledger，也不是 active 静默项。
    observable_consequences:
    - 六项 active 静默项各自阻塞不同的下游断言类别（reset/legality/fault-priority/runtime semantics）
    - D17 不得用单一 decision 关闭：六项 active 静默项的受影响 identity 集合互不相同（64/2/26/2/6/4）
    - S2 若被误当 ledger 行会给出一条虚假的阻塞项，或被误当 PASS 掩盖 S1
    - 历史 S7 是 non-gap：rd2rf/rf2rd 跨 RD/RF 两个不同寄存器组，方向已由原始规范唯一确定
    - S7 不产生 Candidate、不进入 active ledger（non_gap_records.D17:S7 的 in_active_ledger=false、pass_counted=false、candidate_question_ids 为空），也不计 PASS
    candidate_question_ids:
