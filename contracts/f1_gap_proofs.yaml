      source: spec/SimRISC-03-浮点类指令.md
      finding: 上下界在三节完全一致 ⇒ 合法 immu6 集合都是 1~63 ⇒ 任何可执行程序的 rf 侧 ldm/stm 行为在两种读法下无差异；故本项不是行为缺口，仅是表述不一致。
