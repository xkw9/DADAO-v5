      kind: spec-text
      source: spec/SimRISC-03-浮点类指令.md:30,49,133
      finding: immu6 = 0 在 §存取RF寄存器、§寄存器组之间块赋值、§格式转换指令三节各有独立的 ILLI 谓词，故 1~63 的下界 1 在三节都成立。
