      kind: spec-absence-scan
      source: spec/SimRISC-03-浮点类指令.md:30-32
      finding: §存取RF寄存器只列三条 ILLI 谓词（immu6=0、任一起始寄存器+immu6>64、rfha+immu6>64），未复述 1~63。
    - id: S2-E2
      kind: spec-text
      source: spec/SimRISC-00-指令系统设计.md:191
      finding: '`rrri` 的立即数是 6 位、位于 hd[5:0]，编码上限即 63；因此「1~63」的上界 63 由字段位宽唯一决定，不依赖任何一节的文字。'
