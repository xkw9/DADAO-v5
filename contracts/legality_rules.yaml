# DADAO SimRISC 0.5.3 — 合法性规则目录（M1）
#
# 来源：spec/ 规范文档（SimRISC-00~04）经 .tao/knowledge/contract-isa.md 归一化投影，
#       不从实现反推；M1 范围见 contract-isa.md §6/§7.4/§7.5 与附录 A。
#
# 每条规则：
#   id          : 稳定标识符
#   fault       : 异常类型（ILLI/UNDI/MALIGN/IALIGN/RASOF/RASUF）
#   kind        : 检查类型（static/dynamic）
#   spec_cite   : 规范引用（只写章节号，不写行号）
#   status      : active/deferred（deferred = 该特性属 M1 范围外，留后续阶段）
#   description : 规则描述
#
# ── F1（RF 浮点）增量字段（SPEC-102t 新增，**纯增量**）────────────────────────
# 本文件原先只有 `status`（**只描述 M1 语义**）。F1 阶段**不修改任何既有 `status`**，
# 只在相关规则上**追加**下列可选字段，供 .xkw/knowledge/contract-f1-floating.md 使用：
#   f1_status   : F1 阶段的适用性
#                   active  = F1 直接按本规则原文适用
#                   blocked = F1 有适用范围，但被某个 OPEN decision 阻塞，
#                             **不得实现**，须待该 decision 逐条确认后解冻
#   f1_decision : 阻塞本规则的 ADR-1004 decision（D11–D17）；不阻塞时省略
#   f1_note     : 补充说明（可选）
# 没有 `f1_status` 的规则 = **不适用于 F1**；F1 的 f1.legality_refs 不得引用它们。
# 新增的 F1 专属规则一律 `status: deferred`（M1 范围外）+ `f1_status: active`。
#
# **F1 不把 spec 静默项写成 fault 规则**：例如 rf0 的 SBZ 域被写入时的行为
# （合约静默项 S6）在 spec 中既无 fault 类型也无 §锚点，故 `sbz_nonzero`
# 只追加 `f1_status: blocked` 标注，**不新增**任何编码该缺口的规则。
#
# 字段引用约定：description 中引用的寄存器字段名与 contracts/opcodes.yaml 的
#   fields[].name 一致（例如块赋值目的字段为 rdhb/rbhb/rahb，而非 rdha/rbha）。
#
# 范围：
#   - M1 指令 = contract-isa.md 附录 A.1~A.6；编码见 contracts/opcodes.yaml（256 条：
#     178 条 M1 + 78 条 excluded_m1）
#   - M1 范围外（deferred）：RF 浮点（SimRISC-03 全部）、LR-SC 原子（SimRISC-04 §LR-SC指令）、
#     特权 cfx（SimRISC-04 §特权指令）；按 ADR-0004 D5 执行这些编码触发 ILLI
#   - SBZ 非零 → ILLI 由 ADR-0004 D5.3 冻结（架构自定义；spec 未规定 fault 类型）
#   - F1 范围 = SimRISC-03 的 64 个 identity（18 rf-qfc + 46 misc-rf）；权威与
#     逐 identity/facet 清单见 .xkw/knowledge/contract-f1-floating.md。
#     F1 记录仍为 `excluded_m1: true` + `decode: ILLI`（M1 不实现）。

rules:
  # ── RD 目的寄存器规则 ────────────────────────────────────────────────────────
  - id: rd_dest_rd0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §rd0 为目的寄存器约定"
    status: active
    f1_status: active
    f1_note: >
      F1 直接适用，不需新规则。F1 中目的字段为 rd 的 identity 只有
      ft2it/ft2io/ft2ut/ft2uo/fo2it/fo2io/fo2ut/fo2uo（目的 rdhb）、
      ftcls/focls（目的 rdhb）、ftqcmp/ftscmp/foqcmp/foscmp（目的 rdhb）。
      规范依据是 spec/SimRISC-00-指令系统设计.md:55（`rd0` 固定为 0，只读；
      「其余指令目的为 rd0 时触发 ILLI 异常」）——SimRISC-01 不在 F1 权威集内，
      故 F1 侧的引用以 SimRISC-00 为准。
    description: >
      写 rd0 为目的寄存器时触发 ILLI 异常。
      单目的指令不允许（丢弃唯一结果无语义）。
      例外：rrrr 双目的 add.uo/add.so/sub.uo/sub.so/mul.uo/mul.so 允许其中一个目的为 rd0
      （丢弃对应半结果），但不能同时为 rd0，也不能为同一非 rd0 寄存器（见 dual_dest_*）。
      例外：ret rd0, 0 允许（无需设置返回值）。
      访存类指令（ld/st）目的为 rd0 同样触发 ILLI（见 store_src_rd0 与 multi_immu6_zero）。

  - id: store_src_rd0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §rd0 为目的寄存器约定"
    status: active
    description: >
      st*/stm*（RD）指令中 rdha 字段是数据源，存储 rd0 触发 ILLI 异常。
      对应 contracts/opcodes.yaml 中 st.b-rd/st.w-rd/st.t-rd/st.o-rd 与
      stm.b-rd/stm.w-rd/stm.t-rd/stm.o-rd 的 rdha（role: src）。

  - id: dual_dest_both_rd0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §加减操作"
    status: active
    description: >
      add.uo/add.so/sub.uo/sub.so/mul.uo/mul.so 的 rrrr 格式有两个目的寄存器（rdha, rdhb），
      不能同时为 rd0。

  - id: dual_dest_same_reg
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §加减操作"
    status: active
    description: >
      add.uo/add.so/sub.uo/sub.so/mul.uo/mul.so 的 rrrr 格式中 rdha 和 rdhb
      不能为同一非 rd0 寄存器。

  # ── RB 目的寄存器规则 ────────────────────────────────────────────────────────
  - id: rb_dest_rb0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §rb0 为目的寄存器约定"
    status: active
    description: >
      rb0 = PC（只读），任何指令以 rb0 为显式目的时触发 ILLI 异常。
      rrii/riii/rwii/rrri 目的字段为 rbha（含 ldm.o-rb 的 rbha）；
      orrr/orri 目的字段为 rbhb（含块赋值 rb2rb/rd2rb 的目的 rbhb）。

  - id: rb_base_rb0_store
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §存取RB寄存器"
    status: active
    description: >
      RB 存储指令 st.o-rb/stm.o-rb 中 rbha 为 rb0 时触发 ILLI 异常
      （rbha 在存储形式下不是写目的，但仍受 rb0 约定约束）。

  # ── RF 操作规则（M1 范围外）──────────────────────────────────────────────────
  - id: rf0_as_operand
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-03 §rf0 为目的寄存器约定"
    status: deferred
    f1_status: blocked
    f1_decision: D11
    f1_note: >
      **F1 不得实现本规则**，直到 D11 被逐条确认。阻塞原因（合约 §7 候选 ADR-1005）：
      spec/SimRISC-03-浮点类指令.md:7 的「浮点运算指令」**范围未定义**——是否覆盖
      §格式转换指令/§浮点分类指令/§浮点比较指令/§浮点条件赋值指令/§寄存器组之间块赋值
      未说明；同一条规则与 :215-216「当 rfhd 为 rf0 时，ftsgnj/fosgnj 实现 abs(rfhc)」
      这一**要求 rfhd=rf0 产生结果**的特例直接冲突；:7 的「rf ld/st 中 rf0 为目的时允许」
      只点名 rf ld/st，未点名 rd2rf/rf2rd。
    description: >
      浮点运算指令的目的或任一源操作数为 rf0 时触发 ILLI 异常
      （rf0 为控制和状态寄存器 FCSR，不可作为普通浮点操作数）。
      浮点类指令（RF）整体属 M1 范围外；M1 仅保留 rf0 的寄存器模型/复位值。

  # ── 多寄存器范围规则 ─────────────────────────────────────────────────────────
  - id: multi_immu6_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §存取RD寄存器"
    status: active
    description: >
      RD/RB 多寄存器与块赋值指令 immu6=0 时触发 ILLI 异常：
      ldm.*/stm.*（RD、RB）、rd2rd/rb2rd/rd2rb/rb2rb。
      不适用于移位/扩展指令的立即数（orri）形式——其 immu6=0 是合法的移位量/起始位。
      RA 多寄存器形式与 RA↔RD 块赋值形式另见 ra_multi_immu6_zero。

  - id: multi_range_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §存取RD寄存器"
    status: active
    description: >
      RD/RB 多寄存器与块赋值指令中起始寄存器 + immu6 > 64 时触发 ILLI 异常，
      不环绕、不截断。起始寄存器为 rrri 形式的 rdha/rbha，或块赋值形式的
      目的 rdhb/rbhb 与源 rdhc/rbhc。
      RA 多寄存器/块赋值形式另见 ra_multi_range_overflow。

  # ── RA 规则（M1 新增）───────────────────────────────────────────────────────
  - id: ra_multi_immu6_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §存取RA寄存器、§寄存器组之间块赋值"
    status: active
    description: >
      RA 多寄存器存取与 RA↔RD 块赋值指令 immu6=0 时触发 ILLI 异常：
      ldm.o-ra/stm.o-ra（多寄存器存取，immu6 指定寄存器个数）与
      ra2rd/rd2ra（RA↔RD 块赋值，immu6 在 hd[5:0]，有效范围 1–63）。

  - id: ra_multi_range_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §存取RA寄存器、§寄存器组之间块赋值"
    status: active
    description: >
      RA 多寄存器/块赋值指令中起始寄存器 + immu6 > 64 时触发 ILLI 异常（超出 ra63）：
      ldm.o-ra/stm.o-ra 检查 raha + immu6 ≤ 64；
      ra2rd 检查目的 rdhb + immu6 ≤ 64 与源 rahc + immu6 ≤ 64；
      rd2ra 检查目的 rahb + immu6 ≤ 64 与源 rdhc + immu6 ≤ 64。

  - id: ra2rd_dest_rd0
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-02 §寄存器组之间块赋值"
    status: active
    description: >
      ra2rd 的目的字段 rdhb 为 rd0 时触发 ILLI 异常（目的不可为 rd0）。
      rd2ra 的目的为 RA 组字段，RA 组无 rd0 约定，不受此约束。

  # ── 数据对齐规则 ─────────────────────────────────────────────────────────────
  - id: data_malign
    fault: MALIGN
    kind: dynamic
    spec_cite: "SimRISC-01 §对齐要求"
    status: active
    description: >
      数据访问未对齐触发 MALIGN 异常（动态，取决于运行时有效地址）。
      ld.o/st.o 与 ld.o-rb/st.o-rb、ld.o-ra/st.o-ra 需 8 字节对齐；
      ld.st/st.t/ld.ut 需 4 字节对齐；ld.sw/st.w/ld.uw 需 2 字节对齐；
      ld.sb/st.b/ld.ub 无对齐要求。
      多寄存器指令同样适用：ldm.o/stm.o（RD/RB/RA）8 字节，ldm.st/stm.t/ldm.ut 4 字节，
      ldm.sw/stm.w/ldm.uw 2 字节，ldm.sb/stm.b/ldm.ub 无。

  # ── 立即数范围规则 ───────────────────────────────────────────────────────────
  - id: imm_range
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §指令域说明"
    status: active
    description: >
      立即数超出操作数格式定义的范围时触发 ILLI 异常（静态）。
      各格式立即数位宽：iiii 24 位、riii 18 位、rrii 12 位、rrri 6 位、rwii 16 位；
      超出字面量无法编码，由编码器/汇编器静态拒绝。

  # ── 移位量溢出规则 ───────────────────────────────────────────────────────────
  - id: shamt_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §位操作指令"
    status: active
    description: >
      移位量超过位宽限制时触发 ILLI 异常（静态）：
      shl.ub/shr.sb/shr.ub: shamt > 7；
      shl.uw/shr.sw/shr.uw: shamt > 15；
      shl.ut/shr.st/shr.ut: shamt > 31；
      shl.uo/shr.so/shr.uo: shamt > 63。

  # ── 扩展位溢出规则 ───────────────────────────────────────────────────────────
  - id: ext_bit_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-01 §位操作指令"
    status: active
    description: >
      扩展起始位超过位宽限制时触发 ILLI 异常（静态）：
      ext.ub/ext.sb: hd > 7；
      ext.uw/ext.sw: hd > 15；
      ext.ut/ext.st: hd > 31；
      ext.uo/ext.so: hd > 63。

  # ── 除法规则 ─────────────────────────────────────────────────────────────────
  - id: div_by_zero
    fault: ILLI
    kind: dynamic
    spec_cite: "SimRISC-01 §乘除操作"
    status: active
    description: >
      除法/取余指令除数为零时触发 ILLI 异常（动态，取决于操作数值）。
      适用于 div.s/div.u/rem.s/rem.u 全部格式；fault 时目的寄存器未写入（精确异常）。

  - id: div_overflow
    fault: ILLI
    kind: dynamic
    spec_cite: "SimRISC-01 §乘除操作"
    status: active
    description: >
      有符号除法溢出（INT_MIN ÷ −1）时触发 ILLI 异常（动态）：
      byte: −128 ÷ −1；wyde: −32768 ÷ −1；tetra: −2147483648 ÷ −1；
      octa: −9223372036854775808 ÷ −1。div.u/rem.u 不存在溢出。

  # ── 保留编码规则 ─────────────────────────────────────────────────────────────
  - id: reserved_undi
    fault: UNDI
    kind: static
    spec_cite: "SimRISC-00 §SimRISC QFC"
    status: active
    description: >
      执行保留编码触发 UNDI 异常：QFC 主表与各 MISC 子表的空白单元格
      （未分配编码），以及保留的 minor-opcode。
      注意：32 位全零指令字是 illi 0，触发 ILLI 而非 UNDI（见 contract-isa.md §2.9）。

  # ── 指令对齐规则 ─────────────────────────────────────────────────────────────
  - id: instruction_align
    fault: IALIGN
    kind: dynamic
    spec_cite: "SimRISC-00 §指令设计"
    status: active
    description: >
      取指时若 PC[1:0] ≠ 00，触发 IALIGN 异常（动态，取决于控制流目标地址）。
      所有指令必须 4 字节对齐。

  # ── SBZ 域规则 ───────────────────────────────────────────────────────────────
  - id: sbz_nonzero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-00 §指令域说明"
    status: active
    f1_status: blocked
    f1_note: >
      **F1 不得实现本规则**。合约静默项 S6：spec/SimRISC-03-浮点类指令.md:7 只说
      rf0「写只读位时静默忽略，rw 位正常写入」，**只覆盖 [63..51] 与 [31..22] 两个只读域**；
      rf0 的 [50..32]、[21..18]、[15..5] 三个 SBZ 域被写入时的行为 spec **未写**。
      spec 未给 fault 类型，所以本规则**不新增**任何编码该缺口的规则，只在此标注阻塞；
      沿用 ADR-0004 D5.3 属**架构自定义**，F1 是否沿用**未决**。
    description: >
      SBZ（Should Be Zero）字段非零时触发 ILLI 异常（静态）。
      ADR-0004 D5.3 冻结「SBZ 非零 → ILLI」（架构自定义；spec 未规定 fault 类型）。
      M1 范围内的 SBZ 字段示例：fence 的 immu18_hi/immu18_mid/immu18_lo bits[17:4]、
      移位指令 shamt 位域之外的高位（如 shl.ub 的 hd[5:3]、shl.uw 的 hd[5:4]）。

  # ── RAS 规则 ─────────────────────────────────────────────────────────────────
  - id: ras_of
    fault: RASOF
    kind: dynamic
    spec_cite: "SimRISC-00 §压栈流程"
    status: active
    description: >
      返回地址栈上溢触发 RASOF 异常（动态，取决于调用深度）。
      RegRAS 满且 MemRAS 不可用，或 MemRAS 引用计数溢出时触发。
      RASOF 为精确异常：RA 寄存器保持异常前状态，PC 指向 call 指令。

  - id: ras_uf
    fault: RASUF
    kind: dynamic
    spec_cite: "SimRISC-00 §弹栈流程"
    status: active
    description: >
      返回地址栈下溢触发 RASUF 异常（动态，取决于调用深度）。
      RegRAS 空且 MemRAS 不可用，或 MemRAS 引用计数下溢/内容无效时触发。
      RASUF 为精确异常：RA 寄存器保持异常前状态，PC 指向 ret 指令。

  # ── LR 指令规则（M1 范围外）─────────────────────────────────────────────────
  - id: lr_hb_not_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-04 §LR-SC指令"
    status: deferred
    description: >
      lr 指令的 hb（rdhb）固定为 rd0，汇编代码仅需两个操作数；
      手工编码时 hb ≠ 0 触发 ILLI 异常。
      LR-SC 原子指令属 M1 范围外（contract-isa.md §7.4），M1 不提取其语义。

  # ── CFX 保留规则（M1 范围外）────────────────────────────────────────────────
  - id: cfx_reserved
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-04 §寄存器传输指令"
    status: deferred
    description: >
      cfxcode 为 reserved 核芯功能扩展（7–14、19–61）时触发 ILLI 异常。
      特权 cfx 指令属 M1 范围外（contract-isa.md §7.5），M1 不提取其语义。

  # ── 浮点 root/log 规则（M1 范围外）──────────────────────────────────────────
  - id: fp_root_invalid_n
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-03 §S1D1"
    status: deferred
    f1_status: active
    f1_note: >
      F1 直接适用：ftroot/foroot 的 immu6 只支持 2（平方根）与 3（立方根），
      其它值触发 ILLI（spec/SimRISC-03-浮点类指令.md:188）。
      注意 spec 同处 :190 明示 `rootn(-0, 2)` 的结果「不做具体要求」——
      那是**语义**开口（合约 semantics facet 记 partial），不是 fault 条件。
    description: >
      ftroot/foroot 指令不支持的 n 值触发 ILLI 异常；仅支持 n=2（平方根）与 n=3（立方根）。
      浮点类指令（RF）整体属 M1 范围外。

  - id: fp_log_invalid_base
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-03 §S1D1"
    status: deferred
    f1_status: active
    f1_note: >
      F1 直接适用：ftlog/folog 的 immu6 只支持 2（log2）、1（e，自然对数）、
      0（10，log10），其它值触发 ILLI（spec/SimRISC-03-浮点类指令.md:192）。
      immu6=0 **不是** multi_immu6_zero 那样的非法零计数——它在此表示底 10。
    description: >
      ftlog/folog 指令不支持的底值触发 ILLI 异常；
      支持的底值：2（log2）、e（自然对数，immu6=1 约定）、10（log10，immu6=0 约定）。
      浮点类指令（RF）整体属 M1 范围外。

  # ── F1 新增规则（SPEC-102t；M1 范围外，仅 F1 适用）──────────────────────────
  - id: fp_malign_rf
    fault: MALIGN
    kind: dynamic
    spec_cite: "SimRISC-03 §存取RF寄存器"
    status: deferred
    f1_status: active
    f1_note: >
      F1 新增（纯增量）。F1 不引用既有的 data_malign：后者是 M1 规则且其
      description 里的指令名列表不含 RF 侧。规范依据
      spec/SimRISC-03-浮点类指令.md:25。
    description: >
      RF 存取未对齐触发 MALIGN 异常（动态，取决于运行时有效地址）：
      ld.o-rf/st.o-rf/ldm.o-rf/stm.o-rf 需 8 字节对齐；
      ld.t-rf/st.t-rf/ldm.t-rf/stm.t-rf 需 4 字节对齐。
      对齐以元素为单位还是以首地址为单位，规范未逐字说明；
      合约静默项 S4 只登记「多 fault 条件并存时无优先级」，不推断对齐粒度。

  - id: fp_block_immu6_zero
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-03 §存取RF寄存器、§寄存器组之间块赋值、§格式转换指令"
    status: deferred
    f1_status: active
    f1_note: >
      F1 新增（纯增量）。覆盖 ldm.*-rf/stm.*-rf（:29）、rd2rf/rf2rd（:48）、
      全部 22 条格式转换（:132）的「immu6 = 0 时触发 ILLI 异常」。
      immu6 上限 63 由 6 位字段宽度唯一决定（SimRISC-00:191 `rrri` 的
      `hd[5:0]`），故 §块赋值/§格式转换 的「有效范围 1~63」不构成额外 fault 条件
      （合约静默项 S2：表述不一致但无行为后果）。
      **不适用于** ftlog/folog：其 immu6=0 表示底 10（见 fp_log_invalid_base）。
    description: >
      RF 多寄存器存取、RF↔RD 块赋值与格式转换指令 immu6=0 时触发 ILLI 异常：
      ldm.t-rf/stm.t-rf/ldm.o-rf/stm.o-rf（immu6 = 连续转换的寄存器个数）、
      rd2rf/rf2rd（immu6 = 寄存器个数）、全部 22 条格式转换指令。
      不适用于 ftroot/foroot/ftlog/folog——它们的 immu6 是 n 值 / 底值编码
      （n 支持 2/3；底支持 0/1/2），immu6=0 对 ftlog/folog 是**合法**的 log10。

  - id: fp_block_range_overflow
    fault: ILLI
    kind: static
    spec_cite: "SimRISC-03 §存取RF寄存器、§寄存器组之间块赋值、§格式转换指令"
    status: deferred
    f1_status: active
    f1_note: >
      F1 新增（纯增量）。规范依据 spec/SimRISC-03-浮点类指令.md:30（§存取RF）、
      :49（§块赋值）、:133（§格式转换），三处均写「任一起始寄存器 + immu6 > 64」。
    description: >
      RF 多寄存器存取、RF↔RD 块赋值与格式转换中，起始寄存器 + immu6 > 64 时
      触发 ILLI 异常，不环绕、不截断：
      ldm.*-rf/stm.*-rf 检查 rfha + immu6 ≤ 64；
      rd2rf 检查目的 rfhb + immu6 ≤ 64 与源 rdhc + immu6 ≤ 64；
      rf2rd 检查目的 rdhb + immu6 ≤ 64 与源 rfhc + immu6 ≤ 64；
      格式转换按目的/源各自检查。

